# ==============================================================================
# Mosquitto MQTT Broker - Secure Local Configuration
# ==============================================================================

listener 1883 0.0.0.0
protocol mqtt

# Security: disable anonymous access, enforce password file & ACL
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Persistence for Retained Messages (device states)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
